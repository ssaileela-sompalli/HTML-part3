<!DOCTYPE html>

<body>
    <h1>Select a Fruit</h1>

        <input type="radio" name="fruit" id="id2" value="apple">
        <br>

        <input type="radio" name="fruit" id="id3" value="banana"> 
        <br>

        <br>
        <button type="submit">Submit</button>
    </form>
