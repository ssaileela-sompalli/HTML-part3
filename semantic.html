<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Table Example</title>
</head>
<body>
    <table border="1">
        <caption><b>Student Information</b></caption>
        <thead>
        <tr>
            <th>Name</th>
            <th>Roll No</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>sai</td>
                <td>1</td>
            </tr>
            <tr>
                <td>jaya</td>
                <td>2</td>
            </tr>
            <tr>
                <td>Bhaskar</td>
                <td>3</td>
            </tr>
            <tr>
                <td>jyoshu</td>
                <td>4</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>5 students</td>
                <td>All are present</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
