<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Element</title>
</head>
<body>
    <form action="server.php">
        <label for="volume">Volume:</label>
        <input type="range" id="volume" name="volume" min="50" max="100" step="any">
        <input type="submit">
        <br>
        <label for="brightness">Brightness:</label>
        <input type="range" id="brightness" name="color" min="10" max="100" step="10">
    </form>
</body>
</html>
