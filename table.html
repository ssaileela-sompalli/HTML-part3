<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <table border="1">
        <caption><b>Food Items</b></caption>
        <tr>
            <th>Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Apple</td>
            <td>20rs</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>15rs</td>
        </tr>
        <tr>
            <td>Orange</td>
            <td>25rs</td>
        </tr>
    </table>
</body>
</html>
