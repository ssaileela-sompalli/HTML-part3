<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkboxes Example</title>
</head>
<body>  
    <form action="server.php"> 
    <label for="id1">I am 18+</label>
    <input type="checkbox" id="id1" name="age" value="18+">
    <br>
    <label for="id2">I am not 18+</label>
    <input type="checkbox" id="id2" name="age" value="not 18+">
    <br>
    <label for="id3">I agree to the terms and conditions</label>
    <input type="checkbox" id="id3" name="terms" value="agreed" checked>
    <button type="submit">Submit</button>
    </form>
</body>
</html>
