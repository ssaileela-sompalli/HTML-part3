<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name attribute from website</title>
</head>
<body>
    <form action="https://www.google.com/">
        <label for="id2">Google</label>
        <input type="text" placeholder="Search Google" name="q" id="id2">
        <button type="submit">Submit</button>
    </form>
    <form action="https://www.youtube.com/">
        <label for="id3">Youtube</label>
        <input type="text" placeholder="Search Youtube" name="search_query" id="id3">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
